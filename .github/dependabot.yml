# ============================================================
# TARGET FILE: Lennonhaha/fibemate-react-native  .github/dependabot.yml
# ============================================================
# 这是 PR #13 (sha f702881) 之后的【完整目标文件】。
# PR #13 的 5 条 ignore 规则（fast-xml-parser / eslint / @babel/runtime /
# @react-native/new-app-screen / @react-native/metro-config）已【原样保留】。
#
# 2026-09-12 更新（delta over PR #13 + 上一轮草稿）：
#   新增 ignore:
#     - image-size（有上游补丁 2.0.3；经 metro 传递引入，改用 overrides 强钉）
#     - @babel/core（Babel 8 需与 preset-env 联动，单独升破坏 7.x 生态）
#     - @babel/preset-env（preset-env 8.x 需 @babel/core 8.x，PR #20 已证明破坏 CI）
#   保留上一轮新增:
#     - @react-native-community/*（major）
#     - js-yaml（major）
#     - react-native-safe-area-context（major）
#   不 ignore（有补丁，应随父包自动修）:
#     - browserslist（first_patched 4.28.7）
#     - brace-expansion（first_patched 5.0.7/5.0.9）
#     - joi（first_patched 17.13.5/17.13.6）
#   rubygems（concurrent-ruby / activesupport）不在 npm dependabot 范围，需手动 bundle update。
#
# 应用方式：用本文件整体替换仓库内 .github/dependabot.yml。
# 不要新增 `reason:` 字段——Dependabot v2 schema 不支持，写了会让整个 YAML 被拒。
# ============================================================

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "automerge"
    # ===== PR #13 (sha f702881) 既有规则 —— 原样保留，勿删 =====
    ignore:
      - dependency-name: "fast-xml-parser"
        update-types: ["version-update:semver-major"]
      # eslint 10 与 @react-native/eslint-config@0.86.0 的 peer 范围 ^8||^9 冲突，
      # 安装阶段直接 ERESOLVE 失败（CI 红）。等 RN 工具链放开 peer 范围后再解锁。
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # React Native 0.86 依赖 Babel 7；@babel/runtime 8 是跨大版本，
      # 单独升会破坏 metro / Hermes 的转译链路，应与 RN 整体升级一起做。
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      # 【2026-10-16 撤销 minor 锁】原对下两包 ignore semver-minor ⇒ 钉在 0.86.x；
      # 而 version-family 门禁要求所有 @react-native/* 与 react-native 的 major.minor
      # 相等 ⇒ 永久冲突，任何 react-native minor 升级 PR 必 fail（#47/#54/#55 同根）。
      # 两包上游均有 0.87.x 稳定版（latest=0.88.0）⇒ 解锁以恢复「同 minor 同步升」。
      # ===== 2026-09-12 新增（delta over PR #13） =====
      # @react-native-community/*（cli / cli-platform-android / cli-platform-apple）
      # 随 React Native 核心版本走（0.86.x）。react-native 本体仍是 0.86 时，
      # 单独把 @react-native-community/cli 升到 20.2.0+ 会拉动 RN 工具链前移，
      # 导致 metro / Hermes 转译链路与模板不匹配（对应 PR #18/#19/#20/#21）。
      - dependency-name: "@react-native-community/*"
        update-types: ["version-update:semver-major"]
      # js-yaml 4.x 收紧了隐式类型解析（implicit resolvers），跨大版本可能改变
      # 构建/工具脚本的 YAML 解析结果。低风险、可延后；等上游稳定后再解锁。
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]
      # react-native-safe-area-context 是 RN 0.86 锁定的配套包，跨大版本升级
      # 应与 RN 整体升级一起做，单独升可能破坏布局兼容。
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major"]
      # image-size 经 metro@0.84.4 传递引入（其 range ^1.0.2 ⇒ 装 1.2.1；漏洞区间 <=2.0.2）。
      # GHSA-5p2g-fcmc-qvqq（JXL/HEIF parser infinite loop, high）
      # GHSA-w3rx-r6r6-pgpr（ICNS parser infinite loop, high）
      # 【2026-10-16 更正】上游已有补丁 2.0.3 —— 此前记「无上游补丁」系过期。
      # 父包 range ^1.0.2 不允许 2.x ⇒ Dependabot 无法自行升级，改用 package.json
      # overrides 强钉 "image-size": "2.0.3"。此 ignore 保留，避免反复开无法落地的 major PR。
      # 属构建/开发期依赖，不进 PQC 运行时路径。
      - dependency-name: "image-size"
        update-types: ["version-update:semver-major"]
      # @babel/preset-env 8.x 需 @babel/core@^8，但 RN 0.86 锁定 Babel 7。
      # PR #20 把 preset-env 升到 8.0.2 后 npm ci 直接 EUSAGE 失败（CI 红）。
      # 等 RN 整体迁移到 Babel 8 时一起解锁。
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
      # @babel/core 8.x 与 preset-env 8.x 联动；单独升 core 到 8 会让 preset-env 7.x
      # 的 peer 范围不满足，同样破坏 CI。与 preset-env 同步解锁。
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
    # ===== 已知无上游补丁（保持告警 open；不 dismiss、不 ignore） =====
    # braces（GHSA-vfj7-8cjw-p6xm, high, alert #38）：3.0.3 即该线最新，
    # advisory 的 first_patched_version = null ⇒ 升无可升，override 亦无版本可选。
    # 经 micromatch（^3.0.3）传递引入；属构建/工具链路径，非运行时。
    # 复评条件：braces 发布含修复版本后，重跑 Dependabot 并核对漏洞区间。
    groups:
      react-native-tooling:
        applies-to: version-updates
        patterns:
          - "@react-native/*"
          - "react-native*"
          - "@babel/*"
        # 不把 react-native 本体排除出组：门禁要求它与 @react-native/* 同 minor，
        # 拆开会强制错位（#54/#55 实测）——2026-10-16 撤销。
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
